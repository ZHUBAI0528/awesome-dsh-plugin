name: ZHUBAI0528/dsh-client-ui-aqua-community-fix
category: theme
description:
  en: 'Community-maintained Aqua glass theme for DeepSeek Harness 0.2.1-rc.3: one consistent frosted layout instead of mode switching, adjustable blur and frost, a fluid or image/video wallpaper with per-type blur and brightness, importable fonts with per-role sizes, weights and line height, colour palettes for body, conversation and explanatory copy, and a master switch that restores the stock UI. Continues the Aqua theme by WYH66666666 (DSH-Transparent-UI-Plugin v1.3.0); do not install alongside the upstream.'
  zh: 'Aqua 玻璃主题的社区维护分支，适配 DSH 0.2.1-rc.3：统一的一套玻璃布局（无需切换模式）、可调模糊与磨砂、面板后的流体或图片与视频壁纸（各类型独立可调模糊与亮度）、可导入本地字体的排版体系（三处字号、字重、行高）、正文与会话及说明文字各自的选色方案，以及一键完全还原原生界面的开关。承接 WYH66666666 的 Aqua 主题（DSH-Transparent-UI-Plugin v1.3.0），请勿与上游同装。'
icon: https://raw.githubusercontent.com/ZHUBAI0528/dsh-client-ui-aqua-community-fix/main/assets/icon-180.png
